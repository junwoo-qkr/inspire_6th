server:
  port: 8000

spring:

  # spring mvc view path
  # mvc:
  #   view:
  #     prefix: /WEB-INF/view/  # 파일 경로
  #     suffix: .jsp  # 확장자

  config:
    activate:
      on-profile: dev

  # DB 연결 정보
  datasource:
    driver-class-name: ${DB_DRIVER}
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}

mybatis:
  mapper-locations: classpath:/mappers/*.xml
