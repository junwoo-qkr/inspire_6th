server:
#  port: 0
  port: 8083 # 실습 편의상 고정

spring:
  application:
    name: user-service
#  config:
#    import: optional:configserver:http://localhost:8888
#  cloud:
#    config:
#      name: ecommerce
  h2:
    console:
      enabled: true
      settings:
        web-allow-others: true
      path: /h2-console
#  datasource:
#    driver-class-name: org.h2.Driver
#    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;
#    username: sa
#    password:
  jpa:
    hibernate:
      ddl-auto: update
  security:
    user:
      name: user
      password: $2a$10$ihI.uObUGvEsXUVdtBS/FeDkeFmLARmxrJRtlgbrouufb/qkGlrV.
#      password: "{bcrypt}$2a$10$ihI.uObUGvEsXUVdtBS/FeDkeFmLARmxrJRtlgbrouufb/qkGlrV."
  rabbitmq:
    host: 127.0.0.1
    port: 5672
    username: guest
    password: guest
  zipkin:
    base-url: http://localhost:9411
    enabled: true

logging:
  level:
    org.springframework.security: DEBUG
    com.example.userservice.client: DEBUG

eureka:
  instance:
    instance-id: ${spring.application.name}:${spring.application.instance_id:${random.value}}
    prefer-ip-address: true # 호스트명 대신 IP로 등록
  client:
    service-url:
      defaultZone: http://127.0.0.1:8761/eureka
    fetch-registry: true
    register-with-eureka: true

greeting:
  message: Welcome to the Simple E-commerce.

# config cloud의 값을 사용할 것이기 때문에 필요없음
#token:
#  expiration-time: 86400000 # 1 days
#  secret: my-very-long-secret-key-1234567890123456

management:
  observations:
    annotations:
      enabled: true
  endpoints:
    web:
      exposure:
        include:
          - refresh
          - health
          - beans
          - info
          - httpexchanges
          - busrefresh
          - prometheus
          - metrics
  tracing:
    sampling:
      probability: 1.0  # spring cloud의 모든 log를 전달
    propagation:  # 모든 서비스의 형식이 동일해야 추적이 끊기지 않음
      consume: B3
      produce: B3
  zipkin:
    tracing:  # zipkin 서버에 log를 전달 및 저장할 때 쓰일 endpoint
      endpoint: http://localhost:9411/api/v2/spans

resilience4j:
  circuitbreaker:
    configs:
      default:
        failureRateThreshold: 4
        waitDurationInOpenState: 1000ms
        slidingWindowType: COUNT_BASED
        slidingWindowSize: 2
  timelimiter:
    configs:
      default:
        timeoutDuration: 4s
  retry:
    configs:
      default:
        limitForPeriod: 10
        limitRefreshPeriod: 10s
