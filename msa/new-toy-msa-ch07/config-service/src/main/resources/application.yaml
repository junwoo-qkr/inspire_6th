server:
  port: 8888

spring:
  application:
    name: config-service
  cloud:
    config:
      server:
        git:
          uri: https://github.com/junwoo-qkr/remoteSettings
          default-label: main
  rabbitmq:
    host: 127.0.0.1
    port: 5672
    username: guest
    password: guest

  management:
    endpoints:
      web:
        exposure:
          include:
            - refresh
            - health
            - beans
            - info
            - httpexchanges
            - busrefresh