<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body>
    <div class="container">
        <div class="mb-3 mt-3">
            <label for="email" class="form-label">Email:</label>
            <input type="email" class="form-control" id="email" placeholder="Enter email" name="email">
        </div>
        <div class="mb-3">
            <label for="pwd" class="form-label">Password:</label>
            <input type="password" class="form-control" id="pwd" placeholder="Enter password" name="pswd">
        </div>
        <div class="mb-3 mt-3" id="err_empty_email_pwd" style="display: none; color: red; font-weight: bold;">
            <div class="err_msg">이메일이나 패스워드를 입력하세요.</div>
        </div>
        <button type="button" class="btn btn-primary" id="signInBtn">Submit</button>
    </div>
    <script>
        const user = {
            email: "abc@gmail.com",
            password: 12345
        };
        document.querySelector("#email").value = user.email;
        document.querySelector("#pwd").value = user.password;

        document.querySelector("#signInBtn").onclick = () => {
            window.alert("button clicked");
            let email = document.querySelector("#email").value;
            let pwd = document.querySelector("#pwd").value;
            if (email === "" || pwd === "") {
                document.querySelector("#err_empty_email_pwd").style.display = "block";
            } else {
                document.querySelector("#err_empty_email_pwd").style.display = "none";
                location.href = "http://www.naver.com";
            }
        };
        let age = 24;
        let price = 4000;
        if(age >= 19) {
            console.log(`성인 가격은 ${price}`);
        } else {
            console.log(`청소년 가격은 ${price/2}`);
        }

        let choice = window.parseInt(window.prompt("원하는 음료수 선택: "));
        console.log(`choice = ${choice}`);

        // switch(choice) {
        //     case 1:
        //         window.alert("토레타");
        //         break;
        //     case 2:
        //         window.alert("콜라");
        //         break;
        //     case 3:
        //         window.alert("사이다");
        //         break;
        //     case 4:
        //         window.alert("박카스");
        //         break;
        //     default:
        //         window.alert("알맞는 번호가 아님");
        //         break;
        // }

        choice === 1 ? window.alert("토레타") :
        choice === 2 ? window.alert("콜라") :
        choice === 3 ? window.alert("사이다") :
        choice === 4 ? window.alert("박카스") :
        window.alert("알맞는 번호가 아님");
    </script>
</body>
</html>
