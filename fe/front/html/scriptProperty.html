<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="../css/property.css">
</head>
<body>
    <div>
        <h1 id="title">Blue Coffee</h1>
        <img src="../img/coffee-blue.jpg" width="200px" height="200px" id="image">
    </div>
    <div>
        <button type="button" id="btn">to Pink</button>
    </div>

    <script>
        let isBlue = true;
        const title = document.getElementById("title");
        const image = document.getElementById("image");
        document.querySelector("#btn").addEventListener("click", (e) => {
            if (isBlue) {
                title.textContent = "Pink Coffee";
                image.src = "../img/coffee-pink.jpg";
                e.target.textContent = "to Blue";
                isBlue = false;
            } else {
                title.textContent = "Blue Coffee";
                image.src = "../img/coffee-blue.jpg";
                e.target.textContent = "to Pink";
                isBlue = true;
            }
        });
    </script>
</body>
</html>
