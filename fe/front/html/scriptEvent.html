<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body>
    <div class="container">
    <button type="button" class="btn btn-dark" onclick="signInHandler(event)">Dark</button>
    <button type="button" class="btn btn-dark" id="handler">Dark</button>
    <button type="button" class="btn btn-dark" id="handler2">Dark</button>
    </div>
    <script>
        // 태그의 속성으로 이벤트 선언
        const signInHandler = (e) => {
            window.alert(`event.target = ${e.target}, event.target.value = ${e.target.value}`);
        }
        // 요소 객체의 프로퍼티로 선언
        document.querySelector("#handler").onclick = () => {
            window.alert("button clicked");
        };
        // addEventListener로 선언
        document.querySelector("#handler2").addEventListener("click", () => {
            window.alert("button clicked");
        })
    </script>
</body>
</html>
