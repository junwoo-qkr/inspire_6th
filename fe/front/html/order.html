<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order</title>
    <link href="../css/order.css" rel="stylesheet">
</head>
<body>
    <img src="../img/bg.jpg" style="width: 100%;">
    <h1 id="heading">확인하세요</h1>
    <hr>
    <h2>주문 및 배송</h2>
    <div class="box">
        <span class="accent">오후 2시 이전</span> 주문 건은 당일 발송합니다.<br>
        2시 이후 주문 건은 다음 날 발송합니다. (주말 제외)
    </div>
    <hr>
    <h2>교환 및 환불</h2>
    <div class="box">
        불만족 시 <span class="accent">100%</span> 환불해드립니다.<br>
        고객센터로 문의주세요.
    </div>
    <hr>
    <h2 text="customer">고객센터</h2>
    <div class="box">
        (02) 123-1234<br>
        <span class="text-small">
            상담 시간: 09:00 ~ 18:00 (공휴일제외)
        </span>
    </div>
</body>
</html>
